services:
  netnama:
    build: .
    init: true
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "${NETNAMA_BIND_ADDRESS:-0.0.0.0}:${NETNAMA_HTTP_PORT:-8080}:8080"
    environment:
      NETNAMA_MODE: public
      NETNAMA_HOST: 0.0.0.0
      NETNAMA_PORT: "8080"
    volumes:
      - netnama-data:/data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${NETNAMA_MEMORY_LIMIT:-512m}
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  netnama-data:
