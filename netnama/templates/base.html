<!doctype html>
<html lang="{{ locale }}" dir="{{ dir }}" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}"><meta name="color-scheme" content="dark light">
  <title>{{ t('brand') }} · {{ t(page|default('login')) }}</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.svg') }}" type="image/svg+xml">
  <script src="{{ url_for('static', filename='dist/theme.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='dist/app.css') }}">
  <script id="catalogs" type="application/json">{{ catalogs|tojson }}</script>
  <script defer src="{{ url_for('static', filename='dist/app.js') }}"></script>
</head>
<body data-page="{{ page|default('login') }}">
{% macro icon(name) %}<i data-icon="{{ name }}" aria-hidden="true"></i>{% endmacro %}
{% macro controls() %}
<div class="preferences">
  <div class="locale-picker">
    <button type="button" id="locale-toggle" class="icon-button preference-button" aria-label="{{ t('language') }}" aria-haspopup="menu" aria-expanded="false" aria-controls="locale-menu">{{ icon('languages') }}</button>
    <div id="locale-menu" class="locale-menu" role="menu" aria-label="{{ t('language') }}" data-aria="language" hidden>
      <button type="button" role="menuitemradio" data-locale="fa" aria-checked="{{ 'true' if locale == 'fa' else 'false' }}" tabindex="-1"><span lang="fa" dir="rtl">فارسی</span>{{ icon('check') }}</button>
      <button type="button" role="menuitemradio" data-locale="en" aria-checked="{{ 'true' if locale == 'en' else 'false' }}" tabindex="-1"><span lang="en" dir="ltr">English</span>{{ icon('check') }}</button>
    </div>
  </div>
  <button type="button" id="theme-toggle" class="icon-button preference-button" aria-label="{{ t('theme') }}" data-theme-mode="system"><span id="theme-icon">{{ icon('monitor') }}</span></button>
</div>
{% endmacro %}
{% block body %}{% endblock %}
<div id="toast" role="status" aria-live="polite" hidden></div>
</body></html>
